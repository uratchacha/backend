spring:
  profiles:
    active: dev
    group:
      blue: blue, blue-2,common
      green: green, green-c,common
      test: test,common
      dev: common
server:
  env: blue

---

spring:
  kafka:
    bootstrap-servers: ${KAFKA_URL:172.31.33.187:9092}
    consumer:
      group-id: chat-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 20 # 한 번에 최대 10개의 메시지 가져오기
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: common

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/testdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_URL:172.31.33.187}
      port: 6379
      password: ${REDIS_PASSWORD}

jwt:
  issuer: ${JWT_ISSUER}
  secret: ${JWT_SECRET}

---

spring:
  config:
    activate:
      on-profile: blue

server:
  port: 8080
  serverAddress: 3.37.80.119

serverName: blue_server

---

spring:
  config:
    activate:
      on-profile: blue-2

server:
  port: 8082
  serverAddress: 3.37.80.119

serverName: blue_server_2

---

spring:
  config:
    activate:
      on-profile: green

server:
  port: 8081
  serverAddress: 3.37.80.119

serverName: green_server

---

spring:
  config:
    activate:
      on-profile: green-2

server:
  port: 8083
  serverAddress: 3.37.80.119

serverName: green_server_2