<!-- 테스트용 인덱스 파일  -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Spring Boot Static Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            text-align: center;
            background: #f9f9f9;
        }
        h1 {
            color: #4CAF50;
        }
    </style>
</head>
<body>
<h1>✅ Spring Boot 정적 리소스 테스트 성공!</h1>
<p>이 페이지가 보이면 <strong>index.html</strong>이 잘 연결된 것입니다.</p>

<!-- ✅ 푸시 알림 등록 버튼 -->
<button id="fcmButton">🔔 푸시 알림 등록 요청</button>

<!-- ✅ Firebase SDK CDN 직접 로드 -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-messaging.js"></script>

<!-- ✅ Firebase 초기화 코드 따로 분리 -->
<script src="/firebase-init.js"></script>


<!-- ✅ 버튼 클릭 이벤트 연결 -->
<script>
    document.getElementById("fcmButton").addEventListener("click", function () {
        if (window.requestNotificationPermission) {
            window.requestNotificationPermission();
        } else {
            console.error("❌ 알림 요청 함수가 정의되지 않았습니다.");
        }
    });
</script>
</body>
</html>
